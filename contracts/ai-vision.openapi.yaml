openapi: 3.1.0
info:
  title: AI Vision Service API (B4)
  description: API tiếp nhận luồng ảnh từ Camera (B2). Sử dụng kiến trúc Asynchronous (Fire-and-forget), kết quả AI sẽ được phát tán ngầm qua Webhook sang Analytics (B5) và Core Business (B6).
  version: 2.0.0
  contact:
    name: Team 14
servers:
  - url: http://localhost:8000
    description: Local server
  - url: http://localhost:4011
    description: Prism mock server for AI Vision
tags:
  - name: vision
    description: Image analysis and detection
  - name: system
    description: Health and runtime information
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [system]
      summary: Kiểm tra trạng thái service
      description: Kiểm tra xem service AI Vision có hoạt động bình thường hay không.
      operationId: getVisionHealth
      security: []
      responses:
        "200":
          description: Service hoạt động bình thường
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    service: ai-vision
                    timestamp: "2026-05-22T09:00:00.000000Z"

  /api/v1/vision/analyze:
    post:
      tags: [vision]
      summary: Nạp ảnh vào hàng đợi phân tích AI
      description: Tiếp nhận ảnh từ B2, trả về 202 Accepted ngay lập tức để không làm nghẽn luồng Camera. Quá trình chạy YOLOv8 diễn ra ngầm.
      operationId: analyzeImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              valid_request:
                value:
                  camera_id: "cam-gate-01-entry"
                  image_url: "https://ultralytics.com/images/bus.jpg"
                  timestamp: "2026-05-22T10:30:00Z"
                  correlationId: "corr-unique-string-12345"
      responses:
        "202":
          description: Đã tiếp nhận và đưa vào hàng đợi ngầm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
              examples:
                accepted:
                  value:
                    status: "received"
                    message: "Ảnh đã được đưa vào hàng đợi xử lý ngầm."
        "400":
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                bad_request:
                  value:
                    type: https://smart-campus.local/problems/bad-request
                    title: Bad Request
                    status: 400
                    detail: Validation failed for one or more fields.
                    instance: /api/v1/vision/analyze
        "401":
          description: Thiếu hoặc sai token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                unauthorized:
                  value:
                    type: https://smart-campus.local/problems/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: Missing or invalid bearer token.
                    instance: /api/v1/vision/analyze
        "500":
          description: Lỗi từ phía server
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                internal_error:
                  value:
                    type: https://smart-campus.local/problems/internal-server-error
                    title: Internal Server Error
                    status: 500
                    detail: An unexpected error occurred while queueing the image.
                    instance: /api/v1/vision/analyze

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AnalyzeRequest:
      type: object
      required: [camera_id, image_url, timestamp, correlationId]
      properties:
        camera_id:
          type: string
          minLength: 3
          example: "cam-gate-01-entry"
        image_url:
          type: string
          format: uri
          example: "https://ultralytics.com/images/bus.jpg"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-22T10:30:00Z"
        correlationId:
          type: string
          description: Chuỗi truy vết để đồng bộ log xuyên suốt hệ thống microservice.
          example: "corr-unique-string-12345"

    AnalyzeResponse:
      type: object
      properties:
        status:
          type: string
          example: "received"
        message:
          type: string
          example: "Ảnh đã được đưa vào hàng đợi xử lý ngầm."

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        service:
          type: string
          example: "ai-vision"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-22T09:00:00.000000Z"

    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
