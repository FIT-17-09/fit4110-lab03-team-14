name: Newman Contract Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Lint OpenAPI contracts
        run: npm run lint:contracts

      - name: Start mock servers
        run: nohup node mock-server.js > mock-server.log 2>&1 &

      - name: Wait for mock servers
        run: npx wait-on http-get://localhost:4010/health http-get://localhost:4011/health --timeout 30000

      - name: Run Newman contract tests
        run: npm run test:mock

      - name: Show mock server logs on failure
        if: failure()
        run: cat mock-server.log || true

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
